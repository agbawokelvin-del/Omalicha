<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grading Sheet</title>
  <link rel="stylesheet" href="grade.css">
</head>
<body>

  <div class="container">
    <h1>Student Grading Sheet</h1>

    <div class="form">
      <input type="text" id="studentName" placeholder="Enter student name">
      <input type="number" id="studentScore" placeholder="Enter score (0 - 100)" min="0" max="100">
      <button onclick="addStudent()">Add Student</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>S/N</th>
          <th>Student Name</th>
          <th>Score</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody id="studentTable">
        <!-- Students will appear here -->
      </tbody>
    </table>

    <div class="grade-info">
      <h3>Grading System</h3>
      <p><strong>A</strong> = 80 - 100</p>
      <p><strong>B</strong> = 60 - 79</p>
      <p><strong>C</strong> = 40 - 59</p>
      <p><strong>D</strong> = 0 - 39</p>
    </div>
  </div>

  <script src="grade.js"></script>
</body>
</html>
